name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # macOS: .app bundle + .dmg disk image (native, on macOS runner)
  # ─────────────────────────────────────────────────────────────────────────
  package-macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-latest is Apple Silicon (arm64); amd64 is cross-compiled.
          # clang on macOS targets the requested arch via GOARCH, but only
          # when CGO_ENABLED=1 (CGO is disabled by default when cross-compiling,
          # which excludes all go-gl files and breaks the Fyne build).
          - goarch: amd64
            suffix: x86_64
            cc: clang
          - goarch: arm64
            suffix: arm64
            cc: clang
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.4'

      - name: Determine release version
        shell: bash
        run: |
          set -e
          RAW="$(tr -d '[:space:]' < VERSION)"
          # Strip any pre-release suffix (e.g. -SNAPSHOT) -> x.y.z
          APP_VERSION="${RAW%%-*}"
          if ! printf '%s' "$APP_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid version '$APP_VERSION' (from VERSION='$RAW'). Expected x.y.z[-SNAPSHOT]."
            exit 1
          fi
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "Release version: $APP_VERSION (from VERSION='$RAW')"

      - name: Install fyne CLI
        # Pin to the same version as the project's fyne library (go.mod) to
        # avoid CLI/library incompatibilities.
        run: go install fyne.io/fyne/v2/cmd/fyne@v2.6.2

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: macos-go-${{ matrix.goarch }}-${{ hashFiles('**/go.sum') }}

      - name: Download dependencies
        run: go mod download

      - name: Build raw binary
        env:
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
          CC: ${{ matrix.cc }}
        run: go build -ldflags="-s -w" -o universal-cleaner .

      - name: Package macOS .app
        env:
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
          CC: ${{ matrix.cc }}
        run: |
          fyne package -os darwin -icon Icon.png -name "UniversalCleaner" \
            -appVersion "${{ env.APP_VERSION }}" -appID "com.universalcleaner.app"
          # Debug: show what fyne package produced
          echo "--- Files after fyne package ---"
          ls -la
          find . -maxdepth 2 -name "UniversalCleaner*" -print

      - name: Organize artifacts (.app zip + .dmg)
        run: |
          set -e
          mkdir -p dist
          # fyne package -os darwin creates UniversalCleaner.app (not .dmg).
          # We zip the .app and also create a .dmg with hdiutil.
          if [ -d "UniversalCleaner.app" ]; then
            # Zip the .app bundle
            ditto -c -k --keepParent "UniversalCleaner.app" \
              "dist/UniversalCleaner-macos-${{ matrix.suffix }}.app.zip"
            # Create a .dmg disk image
            hdiutil create -volname "UniversalCleaner" \
              -srcfolder "UniversalCleaner.app" \
              -ov -format UDZO \
              "dist/UniversalCleaner-macos-${{ matrix.suffix }}.dmg"
          else
            echo "::error::UniversalCleaner.app was not created by fyne package"
            exit 1
          fi

      - name: Generate SHA256 checksum
        shell: bash
        run: |
          cd dist
          shopt -s nullglob
          for f in *; do
            [ "$f" = "*.sha256" ] && continue
            shasum -a 256 "$f" > "$f.sha256"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.suffix }}
          path: dist/

  # ─────────────────────────────────────────────────────────────────────────
  # Windows: .exe + .msi installer (native, on Windows runner)
  # ─────────────────────────────────────────────────────────────────────────
  package-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # windows-latest is amd64; 386 is cross-compiled with the 32-bit
          # mingw toolchain (i686-w64-mingw32-gcc) and CGO_ENABLED=1.
          - goarch: amd64
            suffix: x86_64
            cc: gcc
          - goarch: 386
            suffix: x86
            cc: i686-w64-mingw32-gcc
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.4'

      - name: Determine release version
        shell: bash
        run: |
          set -e
          RAW="$(tr -d '[:space:]' < VERSION)"
          APP_VERSION="${RAW%%-*}"
          if ! printf '%s' "$APP_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid version '$APP_VERSION' (from VERSION='$RAW'). Expected x.y.z[-SNAPSHOT]."
            exit 1
          fi
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "Release version: $APP_VERSION (from VERSION='$RAW')"

      - name: Install fyne CLI
        run: go install fyne.io/fyne/v2/cmd/fyne@v2.6.2

      - name: Install mingw toolchain (Windows 386 cross)
        if: matrix.goarch == '386'
        shell: bash
        run: |
          # msys2 is preinstalled on windows-latest; add the 32-bit mingw gcc
          /c/msys64/usr/bin/pacman.exe -S --noconfirm mingw-w64-i686-gcc || true
          echo "C:\msys64\mingw32\bin" >> "$GITHUB_PATH"

      - name: Ensure mingw64 in PATH (Windows amd64)
        if: matrix.goarch == 'amd64'
        shell: bash
        run: echo "C:\msys64\mingw64\bin" >> "$GITHUB_PATH"

      - name: Add WiX Toolset to PATH (for .msi packaging)
        shell: bash
        run: |
          WIX_BIN="C:\Program Files (x86)\WiX Toolset v3.14\bin"
          if [ -d "$WIX_BIN" ]; then
            echo "$WIX_BIN" >> "$GITHUB_PATH"
            echo "WiX added to PATH"
          else
            echo "::warning::WiX Toolset not found at $WIX_BIN; .msi will not be produced"
          fi

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~\.cache\go-build
            ~\go\pkg\mod
          key: windows-go-${{ matrix.goarch }}-${{ hashFiles('**/go.sum') }}

      - name: Download dependencies
        run: go mod download

      - name: Build raw binary
        shell: bash
        env:
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
          CC: ${{ matrix.cc }}
        run: go build -ldflags="-s -w" -o universal-cleaner.exe .

      - name: Package Windows .exe + .msi
        shell: bash
        env:
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
          CC: ${{ matrix.cc }}
        run: |
          fyne package -os windows -icon Icon.png -name "UniversalCleaner" \
            -appVersion "${{ env.APP_VERSION }}" -appID "com.universalcleaner.app"
          # Debug: show what fyne package produced
          echo "--- Files after fyne package ---"
          ls -la

      - name: Organize artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          # fyne package -os windows creates UniversalCleaner.exe (with icon).
          # If WiX is available it also creates UniversalCleaner.msi.
          $found = $false
          if (Test-Path "UniversalCleaner.msi") {
            Move-Item "UniversalCleaner.msi" "dist/UniversalCleaner-windows-${{ matrix.suffix }}.msi"
            $found = $true
          }
          if (Test-Path "UniversalCleaner.exe") {
            Move-Item "UniversalCleaner.exe" "dist/UniversalCleaner-windows-${{ matrix.suffix }}.exe"
            $found = $true
          }
          # Fallback: the raw binary from the build step (lowercase name)
          if (-not $found -and (Test-Path "universal-cleaner.exe")) {
            Move-Item "universal-cleaner.exe" "dist/UniversalCleaner-windows-${{ matrix.suffix }}.exe"
            $found = $true
          }
          if (-not $found) {
            Write-Error "No Windows artifacts were produced by fyne package or go build"
            exit 1
          }

      - name: Generate SHA256 checksum
        shell: pwsh
        run: |
          cd dist
          Get-ChildItem -File | ForEach-Object {
            $hash = (Get-FileHash $_.Name -Algorithm SHA256).Hash
            "$hash  $($_.Name)" | Out-File "$($_.Name).sha256" -Encoding ascii
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.suffix }}
          path: dist/

  # ─────────────────────────────────────────────────────────────────────────
  # Linux: .tar.xz portable + .deb package (native, on Ubuntu runner)
  # ─────────────────────────────────────────────────────────────────────────
  package-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-latest is amd64; arm64 is cross-compiled with
          # aarch64-linux-gnu-gcc + arm64 multiarch libs and CGO_ENABLED=1.
          - goarch: amd64
            suffix: x86_64
            cc: gcc
            pclibdir: ""
          - goarch: arm64
            suffix: arm64
            cc: aarch64-linux-gnu-gcc
            pclibdir: "/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.4'

      - name: Determine release version
        shell: bash
        run: |
          set -e
          RAW="$(tr -d '[:space:]' < VERSION)"
          APP_VERSION="${RAW%%-*}"
          if ! printf '%s' "$APP_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid version '$APP_VERSION' (from VERSION='$RAW'). Expected x.y.z[-SNAPSHOT]."
            exit 1
          fi
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "Release version: $APP_VERSION (from VERSION='$RAW')"

      - name: Install Linux GUI dependencies (amd64 native)
        if: matrix.goarch == 'amd64'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev gcc pkg-config \
            libegl1-mesa-dev libgles2-mesa-dev

      - name: Install Linux GUI dependencies (arm64 cross)
        if: matrix.goarch == 'arm64'
        run: |
          sudo dpkg --add-architecture arm64
          # Ubuntu 24.04 uses deb822 sources; restrict the default sources to
          # amd64 and add arm64 from ports.ubuntu.com.
          sudo sed -i '/^Architectures:/d; /^Types:/a Architectures: amd64' \
            /etc/apt/sources.list.d/ubuntu.sources
          sudo tee /etc/apt/sources.list.d/arm64.sources >/dev/null <<'EOF'
          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports
          Suites: noble noble-updates noble-security
          Components: main universe
          Architectures: arm64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            libgl1-mesa-dev:arm64 \
            libx11-dev:arm64 libxrandr-dev:arm64 libxi-dev:arm64 \
            libxxf86vm-dev:arm64 libxcursor-dev:arm64 libxinerama-dev:arm64

      - name: Install fyne CLI
        run: go install fyne.io/fyne/v2/cmd/fyne@v2.6.2

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: linux-go-${{ matrix.goarch }}-${{ hashFiles('**/go.sum') }}

      - name: Download dependencies
        run: go mod download

      - name: Build raw binary
        env:
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
          CC: ${{ matrix.cc }}
          PKG_CONFIG_LIBDIR: ${{ matrix.pclibdir }}
        run: go build -ldflags="-s -w" -o universal-cleaner .

      - name: Package Linux .tar.xz + .deb
        env:
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
          CC: ${{ matrix.cc }}
          PKG_CONFIG_LIBDIR: ${{ matrix.pclibdir }}
        run: |
          fyne package -os linux -icon Icon.png -name "universal-cleaner" \
            -appVersion "${{ env.APP_VERSION }}" -appID "com.universalcleaner.app"
          # Debug: show what fyne package produced
          echo "--- Files after fyne package ---"
          ls -la

      - name: Organize artifacts
        run: |
          set -e
          mkdir -p dist
          found=false
          for f in *.tar.xz *.deb; do
            if [ -f "$f" ]; then
              ext="${f##*.}"
              mv "$f" "dist/universal-cleaner-linux-${{ matrix.suffix }}.$ext"
              found=true
            fi
          done
          # Also include the raw binary
          if [ -f "universal-cleaner" ]; then
            cp "universal-cleaner" "dist/universal-cleaner-linux-${{ matrix.suffix }}"
            found=true
          fi
          if [ "$found" = false ]; then
            echo "::error::No Linux artifacts were produced"
            exit 1
          fi

      - name: Generate SHA256 checksum
        shell: bash
        run: |
          cd dist
          shopt -s nullglob
          for f in *; do
            case "$f" in *.sha256) continue;; esac
            sha256sum "$f" > "$f.sha256"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.suffix }}
          path: dist/

  # ─────────────────────────────────────────────────────────────────────────
  # Release: collect all artifacts and publish GitHub Release
  # ─────────────────────────────────────────────────────────────────────────
  release:
    needs: [package-macos, package-windows, package-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine release version
        shell: bash
        run: |
          set -e
          RAW="$(tr -d '[:space:]' < VERSION)"
          APP_VERSION="${RAW%%-*}"
          if ! printf '%s' "$APP_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid version '$APP_VERSION' (from VERSION='$RAW'). Expected x.y.z[-SNAPSHOT]."
            exit 1
          fi
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "Release version: $APP_VERSION (from VERSION='$RAW')"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Organize all artifacts
        run: |
          mkdir -p dist
          # Flatten all artifacts into dist/
          find artifacts -type f | while read -r f; do
            cp "$f" "dist/$(basename "$f")"
          done
          # Create consolidated checksums
          cd dist
          echo "SHA256 checksums for Universal Cleaner ${{ env.APP_VERSION }}" > checksums.txt
          echo "" >> checksums.txt
          shopt -s nullglob
          for f in *.dmg *.msi *.exe *.tar.xz *.deb *.app.zip; do
            case "$f" in *.sha256) continue;; esac
            sha256sum "$f" >> checksums.txt
          done
          echo "" >> checksums.txt
          cat checksums.txt
          ls -la

      - name: Generate release notes
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          CURRENT_TAG="v${{ env.APP_VERSION }}"

          {
            echo "## Universal Cleaner ${CURRENT_TAG}"
            echo ""
            if [ -n "$PREVIOUS_TAG" ]; then
              echo "### Changes since ${PREVIOUS_TAG}"
              echo ""
              git log --pretty=format:"- %s (%h)" "$PREVIOUS_TAG..HEAD"
              echo ""
            else
              echo "First release of Universal Cleaner."
              echo ""
            fi
            echo ""
            echo "## Downloads"
            echo ""
            echo "| Platform | File |"
            echo "|----------|------|"
            echo "| macOS (Apple Silicon) | \`UniversalCleaner-macos-arm64.dmg\` |"
            echo "| macOS (Intel) | \`UniversalCleaner-macos-x86_64.dmg\` |"
            echo "| Windows (64-bit) | \`UniversalCleaner-windows-x86_64.msi\` or \`.exe\` |"
            echo "| Windows (32-bit) | \`UniversalCleaner-windows-x86.msi\` or \`.exe\` |"
            echo "| Linux (64-bit) | \`universal-cleaner-linux-x86_64.tar.xz\` or \`.deb\` |"
            echo "| Linux (ARM64) | \`universal-cleaner-linux-arm64.tar.xz\` or \`.deb\` |"
            echo ""
            echo "## Installation"
            echo ""
            echo "### macOS"
            echo "1. Download the \`.dmg\` file for your architecture"
            echo "2. Open the \`.dmg\` and drag **UniversalCleaner** to **Applications**"
            echo "3. On first launch, right-click → **Open** to bypass Gatekeeper"
            echo ""
            echo "### Windows"
            echo "1. Download the \`.msi\` installer (or \`.exe\` portable)"
            echo "2. Double-click to install"
            echo "3. Launch from the Start Menu"
            echo ""
            echo "### Linux"
            echo "- **Debian/Ubuntu**: Install the \`.deb\` with \`sudo dpkg -i universal-cleaner-linux-*.deb\`"
            echo "- **Other distros**: Extract the \`.tar.xz\` and run the binary"
            echo ""
            echo "## Verify Downloads"
            echo ""
            echo "Check the \`checksums.txt\` file for SHA256 hashes of all downloads."
          } > release_notes.md

          cat release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Universal Cleaner v${{ env.APP_VERSION }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: |
            dist/*.dmg
            dist/*.msi
            dist/*.exe
            dist/*.tar.xz
            dist/*.deb
            dist/*.app.zip
            dist/checksums.txt
            dist/*.sha256
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
