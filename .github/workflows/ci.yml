name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  ci:
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: native amd64 runner, install graphics deps via apt
          - { runs_on: ubuntu-latest, goos: linux,   goarch: amd64, cc: gcc,                  label: linux-amd64,   pclibdir: "" }
          # Linux 386: cross-compile on amd64 with gcc -m32 and i386 multiarch libs
          - { runs_on: ubuntu-latest, goos: linux,   goarch: 386,   cc: "gcc -m32",            label: linux-386,     pclibdir: "/usr/lib/i386-linux-gnu/pkgconfig:/usr/share/pkgconfig" }
          # Linux arm64: cross-compile on amd64 using ports.ubuntu.com arm64 libs
          - { runs_on: ubuntu-latest, goos: linux,   goarch: arm64, cc: aarch64-linux-gnu-gcc, label: linux-arm64,   pclibdir: "/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig" }
          # Windows: native runner, mingw provides the OpenGL/GLFW toolchain
          - { runs_on: windows-latest, goos: windows, goarch: amd64, cc: gcc,                  label: windows-amd64, pclibdir: "" }
          - { runs_on: windows-latest, goos: windows, goarch: 386,   cc: i686-w64-mingw32-gcc,  label: windows-386,   pclibdir: "" }
          # macOS: native runner, OpenGL framework + Cocoa built in
          - { runs_on: macos-latest,   goos: darwin,  goarch: amd64, cc: clang,                 label: darwin-amd64,  pclibdir: "" }
          - { runs_on: macos-latest,   goos: darwin,  goarch: arm64, cc: clang,                 label: darwin-arm64,  pclibdir: "" }

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23.4'
        cache: true

    - name: Install graphics deps (Linux native amd64)
      if: runner.os == 'Linux' && matrix.goarch == 'amd64'
      run: |
        sudo apt-get update
        # go-gl/glfw compiles GLFW from vendored source, so libglfw3-dev is NOT needed;
        # we only need OpenGL (libGL) and the X11 dev libraries.
        sudo apt-get install -y libgl1-mesa-dev xorg-dev

    - name: Install graphics deps (Linux 386 cross)
      if: runner.os == 'Linux' && matrix.goarch == '386'
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y \
          gcc-multilib g++-multilib \
          libgl1-mesa-dev:i386 \
          libx11-dev:i386 libxrandr-dev:i386 libxi-dev:i386 \
          libxxf86vm-dev:i386 libxcursor-dev:i386 libxinerama-dev:i386

    - name: Install graphics deps (Linux arm64 cross)
      if: runner.os == 'Linux' && matrix.goarch == 'arm64'
      run: |
        sudo dpkg --add-architecture arm64
        # Ubuntu 24.04 uses deb822 sources; restrict the default sources to amd64
        # and add arm64 from ports.ubuntu.com.
        sudo sed -i '/^Architectures:/d; /^Types:/a Architectures: amd64' \
          /etc/apt/sources.list.d/ubuntu.sources
        sudo tee /etc/apt/sources.list.d/arm64.sources >/dev/null <<'EOF'
        Types: deb
        URIs: http://ports.ubuntu.com/ubuntu-ports
        Suites: noble noble-updates noble-security
        Components: main universe
        Architectures: arm64
        Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
        EOF
        sudo apt-get update
        sudo apt-get install -y \
          gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
          libgl1-mesa-dev:arm64 \
          libx11-dev:arm64 libxrandr-dev:arm64 libxi-dev:arm64 \
          libxxf86vm-dev:arm64 libxcursor-dev:arm64 libxinerama-dev:arm64

    - name: Install mingw toolchain (Windows 386 cross)
      if: runner.os == 'Windows' && matrix.goarch == '386'
      shell: bash
      run: |
        # msys2 is preinstalled on windows-latest; add the 32-bit mingw gcc
        /c/msys64/usr/bin/pacman.exe -S --noconfirm mingw-w64-i686-gcc || true
        echo "C:\msys64\mingw32\bin" >> "$GITHUB_PATH"

    - name: Ensure mingw64 in PATH (Windows amd64)
      if: runner.os == 'Windows' && matrix.goarch == 'amd64'
      shell: bash
      run: echo "C:\msys64\mingw64\bin" >> "$GITHUB_PATH"

    - name: Download dependencies
      run: go mod download

    - name: Verify dependencies
      run: go mod tidy && git diff --exit-code go.mod go.sum

    - name: Check code formatting
      shell: bash
      run: |
        if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
          echo "The following files are not formatted:"
          gofmt -s -l .
          exit 1
        fi

    - name: Run tests (pure-Go core)
      run: go test -v -race -coverprofile=coverage.out ./internal/core/...

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ matrix.label }}
        path: coverage.out
        if-no-files-found: ignore

    - name: Build for ${{ matrix.goos }}/${{ matrix.goarch }}
      shell: bash
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        CGO_ENABLED: 1
        CC: ${{ matrix.cc }}
      run: |
        echo "Building for $GOOS/$GOARCH with CC=$CC"
        if [ -n "${{ matrix.pclibdir }}" ]; then
          export PKG_CONFIG_LIBDIR="${{ matrix.pclibdir }}"
          echo "PKG_CONFIG_LIBDIR=$PKG_CONFIG_LIBDIR"
        fi
        OUT="${{ runner.temp }}/universal-cleaner"
        if [ "$GOOS" = "windows" ]; then OUT="$OUT.exe"; fi
        go build -v -o "$OUT" .
        ls -la "$OUT"
